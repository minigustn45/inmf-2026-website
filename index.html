/* ================= router ================= */
function route(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const key = P[h] ? h : 'home';
  const sec = key === 'home' ? '' : key.split('/')[0];
  document.documentElement.lang = state.lang;
  document.documentElement.classList.toggle('is-home', key === 'home');
  document.title = k('2026 국제 해군 군수 및 MRO 협력 포럼','2026 International Naval Logistics & MRO Cooperation Forum');
  renderHeader(sec);
  document.getElementById('app').innerHTML = P[key]();
  renderFooter();
  const td=document.getElementById('today'); if (td){ const d=new Date(); td.textContent = d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; }
  updateGnbScrolled();
  initReveal();
  // on narrow screens the tab row scrolls: bring the current tab into view
  const tabs = document.querySelector('.ph-tabs'), cur = tabs && tabs.querySelector('[aria-current]');
  if (cur && tabs.scrollWidth > tabs.clientWidth) tabs.scrollLeft = Math.max(0, cur.offsetLeft - tabs.offsetLeft - 20);
}
let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  const same = location.hash.split('/').slice(0,3).join('/') === lastHash.split('/').slice(0,3).join('/');
  lastHash = location.hash;
  route();
  if (!same) window.scrollTo(0, 0);
});
/* header background state on scroll (transparent-over-hero on home, solid elsewhere) */
function updateGnbScrolled(){
  const root = document.documentElement;
  root.classList.toggle('scrolled', window.scrollY > 8);
  const mid = (parseFloat(getComputedStyle(root).getPropertyValue('--w-gh')) || 72) / 2;
  let scene = '';
  document.querySelectorAll('body [data-scene]').forEach(el => { const r = el.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid) scene = el.dataset.scene; });
  if (scene) root.dataset.scene = scene; else delete root.dataset.scene;
  updateLife();
  const hero = document.querySelector('.hero');
  if (hero && MOTION) hero.style.setProperty('--p', Math.min(1, Math.max(0, window.scrollY / hero.offsetHeight)).toFixed(3));
}
const MOTION = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;
function updateLife(){
  const life = document.querySelector('.life'); if (!life) return;
  const steps = [...life.querySelectorAll('.ls')], live = MOTION && window.innerWidth > 760;
  let lf = 1;
  if (live) { const tr = life.querySelector('.life-track'), span = tr.offsetHeight - window.innerHeight; lf = Math.min(1, Math.max(0, -tr.getBoundingClientRect().top / (span * .92))); }
  let now = 0; steps.forEach((s, i) => { if (lf >= parseFloat(s.style.getPropertyValue('--x')) - .002) now = i; });
  if (!live) now = steps.length - 1;
  life.style.setProperty('--lf', lf.toFixed(4));
  steps.forEach((s, i) => { s.classList.toggle('is-past', live && i < now); s.classList.toggle('is-now', !live || i === now); });
  life.dataset.now = now;
  const cnt = life.querySelector('.life-count b'); if (cnt) cnt.textContent = String(now + 1).padStart(2, '0');
}
window.addEventListener('resize', () => updateGnbScrolled());
if (MOTION) document.documentElement.classList.add('js-motion');
let revealIO = null;
function initReveal(){
  const els = document.querySelectorAll('[data-reveal],[data-reveal-stage]');
  if (!MOTION || !('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('is-in')); return; }
  if (revealIO) revealIO.disconnect();
  revealIO = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); revealIO.unobserve(e.target); } }), { threshold: .2, rootMargin: '0px 0px -10% 0px' });
  els.forEach(el => revealIO.observe(el));
}
let gnbTick = false;
window.addEventListener('scroll', () => {
  if (gnbTick) return;
  gnbTick = true;
  requestAnimationFrame(() => { updateGnbScrolled(); gnbTick = false; });
}, { passive: true });

/* ================= interactions ================= */
function selectCountry(code){
  state.country = state.country === code ? null : code;
  document.querySelectorAll('.pt').forEach(p => p.classList.toggle('on', p.dataset.c === state.country));
  document.querySelectorAll('.route').forEach(r => r.classList.toggle('on', r.dataset.c === state.country));
  document.querySelectorAll('.net-c').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === state.country));
  document.querySelectorAll('.data tr[data-c]').forEach(r => r.classList.toggle('sel', r.dataset.c === state.country));
  const ro = document.getElementById('readout'); if (ro) ro.innerHTML = readout(state.country);
}
document.addEventListener('click', e => {
  const lang = e.target.closest('[data-lang]');
  if (lang){ state.lang = lang.dataset.lang; try{ localStorage.setItem('forum-lang', state.lang); }catch(err){} route(); return; }
  if (e.target.closest('.scroll-cue')){ const next = document.querySelector('.intro') || document.querySelector('.netsec'); if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (e.target.closest('#burger')){ const m = document.getElementById('menu'); const on = m.classList.toggle('show'); e.target.closest('#burger').setAttribute('aria-expanded', on); return; }
  const menuBtn = e.target.closest('.menu>li>button');
  if (menuBtn){ const li = menuBtn.parentElement; const was = li.classList.contains('open'); document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open')); if(!was) li.classList.add('open'); return; }
  if (e.target.closest('.drop a')){ document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open')); document.getElementById('menu').classList.remove('show'); }
  const day = e.target.closest('[data-day]');
  const vw = e.target.closest('[data-view]');
  if (vw){ state.view = vw.dataset.view; document.getElementById('app').innerHTML = P['program/schedule'](); initReveal(); updateGnbScrolled(); const b=document.querySelector(`[data-view="${state.view}"]`); if(b) b.focus(); return; }
  if (day){ state.day = +day.dataset.day; const d = document.getElementById('sch-d' + state.day); if (d) d.scrollIntoView({ behavior: MOTION ? 'smooth' : 'auto', block: 'start' }); return; }
  const nc = e.target.closest('.net-c'); if (nc){ selectCountry(nc.dataset.c); return; }
  const pt = e.target.closest('.pt'); if (pt){ selectCountry(pt.dataset.c); return; }
  const row = e.target.closest('.data tr[data-c]'); if (row){ selectCountry(row.dataset.c); document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if (!e.target.closest('.menu')) document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pt')){ e.preventDefault(); selectCountry(e.target.dataset.c); }
  if (e.key === 'Escape') document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('mouseover', e => {
  const pt = e.target.closest('.pt'); const ro = document.getElementById('readout');
  if (pt && ro) ro.innerHTML = readout(pt.dataset.c);
});
document.addEventListener('mouseout', e => {
  const pt = e.target.closest('.pt'); const ro = document.getElementById('readout');
  if (pt && ro && !(e.relatedTarget && pt.contains(e.relatedTarget))) ro.innerHTML = readout(state.country);
});
document.addEventListener('input', e => {
  if (e.target.id === 'bcount' || e.target.name === 'btype') updateFee();
});
document.addEventListener('change', e => { if (e.target.name === 'btype') updateFee(); });
function updateFee(){
  const o = document.getElementById('bfee'); if (!o) return;
  const t = document.querySelector('input[name="btype"]:checked'); const n = Math.max(0, parseInt(document.getElementById('bcount').value,10) || 0);
  o.textContent = t && t.value === 'raw' ? k('무료','Free') : won(n * BOOTH_PRICE);
}
document.addEventListener('submit', e => {
  const f = e.target.closest('form.f'); if (!f) return;
  e.preventDefault();
  const st = f.querySelector('.status');
  if (!f.checkValidity()){
    const bad = f.querySelector(':invalid');
    st.className = 'status err';
    st.textContent = k('필수 항목을 확인해 주세요. 이메일 형식과 개인정보 동의 여부를 함께 확인해 주세요.','Check the required fields, including the email format and the consent box.');
    if (bad) bad.focus();
    return;
  }
  st.className = 'status ok';
  const msg = { exhibitor:k('전시 참가 신청서가 작성되었습니다. 사무국 검토 후 확정 통보를 드립니다. 문의: 055-602-1993','Application completed. The secretariat will confirm after review. Questions: +82 55-602-1993'),
    visitor:k('사전등록 신청이 작성되었습니다. 등록 확인 메일은 접수 시스템 오픈 후 발송됩니다.','Registration completed. A confirmation email will follow once online intake opens.'),
    contact:k('문의가 작성되었습니다. 사무국 연락처 공지 후 순차적으로 답변드립니다.','Message completed. The secretariat will reply once contact channels open.') };
  st.textContent = msg[f.dataset.form];
});

route();
</script>
</body>
</html>
