<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 국제 해군 군수 및 MRO 협력 포럼 | International Naval Logistics & MRO Cooperation Forum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#0B1624; --muted:#51606F; --line:#D6DEE7;
  --navy:#06080E; --navy2:#0C1726; --on-navy:#EEF4FA; --on-navy-muted:#94A9C0; --grid:#16304D;
  --blue:#1C78D2; --blue-soft:#E4F0FC; --cyan:#46C9F3; --red:#E8352C;
  --flag:#46C9F3; --flag-ink:#03131D;
  --display:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --latin:"Inter","Pretendard Variable","Pretendard",sans-serif;
  --wrap:1180px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111C; --surface:#101B2A; --ink:#E4EBF2; --muted:#9AAABB; --line:#1F3148;
    --navy:#05070C; --navy2:#0C1726; --grid:#1B3A5E; --blue:#5DB0F0; --blue-soft:#12283F;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111C; --surface:#101B2A; --ink:#E4EBF2; --muted:#9AAABB; --line:#1F3148;
  --navy:#05070C; --navy2:#0C1726; --grid:#1B3A5E; --blue:#5DB0F0; --blue-soft:#12283F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all}
img,svg{max-width:100%}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-999px;top:0;background:var(--flag);color:var(--flag-ink);padding:8px 12px;z-index:100}
.skip:focus{left:8px}
#app:focus{outline:none}
#app:focus-visible{outline:2px solid var(--w-cyan);outline-offset:-2px}

/* ================= WAKE — header / hero / intro ================= */
:root{
  /* WAKE design tokens — color */
  --w-ink:#07090D; --w-deep:#0D1219; --w-paper:#EEEDE8; --w-paper-2:#E4E2DB;
  --w-t1:#ECEEF0; --w-t2:#8B95A1; --w-t3:#545E6A;            /* text on ink */
  --w-p1:#111418; --w-p2:#5B636C; --w-p3:#8E949A;            /* text on paper */
  --w-line:rgba(170,188,208,.16); --w-line-p:rgba(17,20,24,.14);
  --w-steel:#6F8FA8; --w-red:#FF4B3E; --w-cyan:#5FC3E4;       /* red: export points only; cyan: meridian / Changwon / focus */
  /* type */
  --w-display:"Inter Tight","Inter","Pretendard Variable","Pretendard",sans-serif;
  --w-ui:"Inter","Pretendard Variable","Pretendard",system-ui,sans-serif;
  --w-kr:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --w-fs-n:clamp(72px,9vw,160px); --w-fs-h:clamp(30px,3.4vw,52px); --w-fs-b:16px; --w-fs-l:11px;
  /* space / grid */
  --w-s1:8px; --w-s2:16px; --w-s3:24px; --w-s4:40px; --w-s5:64px; --w-s6:104px; --w-s7:168px;
  --w-gh:72px; --w-pad:clamp(20px,3.3vw,48px); --w-gut:clamp(12px,1.7vw,24px);
  /* motion */
  --w-ease:cubic-bezier(.2,.7,.2,1); --w-dur:.8s; --w-dur-l:1.2s;
}
b,strong{font-weight:600}

/* ---------- header (WAKE) ---------- */
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--w-ink);color:var(--w-t1);border-bottom:1px solid rgba(255,255,255,.07);transition:background-color .5s var(--w-ease),border-color .5s var(--w-ease),color .5s var(--w-ease)}
html.is-home .gnb{background:transparent;border-bottom-color:transparent}
html.is-home.scrolled .gnb,.gnb:has(.menu.show){background:var(--w-ink);border-bottom-color:rgba(255,255,255,.07)}
.gnb .wrap{display:flex;align-items:center;gap:32px;height:var(--w-gh);max-width:none;padding:0 var(--w-pad)}
.brand{display:flex;align-items:center;color:inherit;text-decoration:none;min-width:0}
.brand-mark{display:flex;align-items:flex-start;gap:5px;font:600 18px/1 var(--w-display);letter-spacing:-.01em}
.brand-mark span{margin-top:1.2px;font-weight:400;font-size:10px;line-height:1;letter-spacing:.04em;opacity:.6}
.menu{display:flex;gap:0;margin:0 0 0 auto;list-style:none;padding:0}
.menu>li{position:relative}
.menu>li>button{position:relative;background:none;border:0;color:inherit;opacity:.7;font:500 11.5px/1 var(--w-ui);letter-spacing:.16em;padding:30px 14px;cursor:pointer;transition:opacity .2s ease}
.menu>li>button:hover,.menu>li>button[aria-current="true"],.menu>li.open>button,.menu>li:focus-within>button{opacity:1}
.menu>li>button[aria-current="true"]::after{content:'';position:absolute;left:14px;right:14px;bottom:22px;height:1px;background:currentColor}
.menu .drop{position:absolute;top:100%;left:0;min-width:248px;margin:0;padding:12px 0;list-style:none;display:none;background:var(--w-deep);border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 48px rgba(0,0,0,.36)}
.menu>li:hover .drop,.menu>li:focus-within .drop,.menu>li.open .drop{display:block}
.drop a{position:relative;display:block;padding:10px 22px;color:var(--w-t2);text-decoration:none;font:400 14px/1.45 var(--w-kr);letter-spacing:-.005em;transition:color .2s ease,padding-left .3s var(--w-ease)}
.drop a::before{content:'';position:absolute;left:22px;top:50%;width:0;height:1px;background:var(--w-cyan);transition:width .3s var(--w-ease)}
.drop a:hover,.drop a:focus-visible{color:var(--w-t1);padding-left:40px}
.drop a:hover::before,.drop a:focus-visible::before{width:10px}
.tools{display:flex;align-items:center;gap:18px}
.lang{display:flex;align-items:center}
.lang button{background:none;border:0;color:inherit;opacity:.4;font:500 11px/1 var(--w-ui);letter-spacing:.12em;padding:8px 7px;cursor:pointer}
.lang button+button{border-left:1px solid currentColor;border-left-color:color-mix(in srgb,currentColor 22%,transparent)}
.lang button[aria-pressed="true"]{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--body);padding:14px 22px;border-radius:4px;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn-flag{background:var(--flag);color:var(--flag-ink)}
.btn-flag{background:linear-gradient(180deg,#6FD8F7,#2FA9E6);color:var(--flag-ink)}
.btn-flag:hover{background:linear-gradient(180deg,#8AE2FA,#43B7EE)}

.gnb .btn{padding:10px 14px;font-size:13px}
.gnb .btn.nav-cta{background:transparent;border:1px solid currentColor;border-color:color-mix(in srgb,currentColor 32%,transparent);border-radius:0;color:inherit;font:500 11px/1 var(--w-ui);letter-spacing:.14em;text-transform:uppercase;padding:11px 16px;transition:border-color .25s ease}
.gnb .btn.nav-cta:hover{border-color:currentColor}
.burger{display:none;background:none;border:0;color:inherit;padding:8px;cursor:pointer}
/* scene-aware: over paper scenes the bar inverts (sections opt in with data-scene="paper") */
html.scrolled[data-scene="paper"] .gnb{background:var(--w-paper);color:var(--w-p1);border-bottom-color:var(--w-line-p)}
html.scrolled[data-scene="paper"] .gnb:has(.menu.show){background:var(--w-ink);color:var(--w-t1);border-bottom-color:rgba(255,255,255,.07)}
@media (max-width:1020px){
  .burger{display:block}
  .tools{margin-left:auto}
  .menu{display:none;position:absolute;top:var(--w-gh);left:0;right:0;background:var(--w-ink);color:var(--w-t1);flex-direction:column;padding:8px 0 20px;max-height:calc(100vh - var(--w-gh));overflow:auto;gap:0;border-top:1px solid rgba(255,255,255,.07)}
  .menu.show{display:flex}
  .menu>li>button{padding:18px var(--w-pad) 10px;width:100%;text-align:left;opacity:.5;font-size:11px}
  .menu>li>button[aria-current="true"]::after{display:none}
  .menu .drop{position:static;display:block;background:transparent;border:0;box-shadow:none;padding:0 0 6px}
  .drop a{color:var(--w-t1);padding:9px var(--w-pad);font-size:16px}
  .drop a::before{display:none}
  .drop a:hover,.drop a:focus-visible{padding-left:calc(var(--w-pad) + 6px);color:#fff}
  .gnb .tools .btn{display:none}
}

/* ---------- key visual layer (shared by hero + about remnant) ---------- */
.kv-in{position:absolute;inset:0;isolation:isolate}
.kv-in img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(.42) brightness(.8) contrast(1.06)}
.kv-grade{position:absolute;inset:0;background:var(--w-steel);mix-blend-mode:color;opacity:.5}
.kv-dot{position:absolute;width:1.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#FF5A4E 0 30%,rgba(255,75,62,.45) 42%,rgba(255,75,62,0) 70%)}
.kv-pt{position:absolute;width:0;height:0}
.kv-pt::before,.kv-pt::after{content:'';position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;opacity:0}
.kv-pt::before{border:1px solid rgba(255,112,98,.7)}
.kv-pt::after{background:radial-gradient(circle,rgba(255,98,84,.32) 0%,rgba(255,98,84,0) 62%)}

/* ---------- hero (scene 01) ---------- */
.hero{--w-mark:clamp(120px,23.5vw,390px);--w-hb:clamp(40px,7vh,72px);--p:0;position:relative;overflow:hidden;isolation:isolate;margin-top:calc(-1 * var(--w-gh));min-height:max(680px,min(100vh,980px));min-height:max(680px,min(100svh,980px));display:flex;flex-direction:column;background:var(--w-ink);color:var(--w-t1)}
.hero-kv{position:absolute;z-index:0;top:-3%;left:17%;height:110%;aspect-ratio:1500/1221;
  transform:translate3d(calc(-5% * var(--p)),calc(7% * var(--p)),0) scale(calc(1 + .06 * var(--p)));
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 34%);mask-image:linear-gradient(90deg,transparent 0%,#000 34%)}
.hero-kv::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,13,.8) 0%,rgba(7,9,13,0) 24%,rgba(7,9,13,0) 56%,var(--w-ink) 92%)}
.hero::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,var(--w-ink) 0%,rgba(7,9,13,0) 18%),linear-gradient(270deg,rgba(7,9,13,.9) 0%,rgba(7,9,13,.6) 22%,rgba(7,9,13,0) 42%)}
.hero-stage{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto 1fr auto;column-gap:var(--w-gut);padding:calc(var(--w-gh) + clamp(48px,9vh,112px)) var(--w-pad) var(--w-hb)}
.hero-cap{grid-column:1 / 6;grid-row:1;align-self:start}
.hero-l3{margin:0;display:flex;gap:14px;font:600 12px/1.55 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t1)}
.hero-l3 .nb{white-space:nowrap}
.hero-l3::before{content:'';flex:none;width:28px;height:1px;margin-top:.8em;background:var(--w-cyan)}
.hero-l4{margin:20px 0 0 42px;font:500 15px/1.5 var(--w-kr);letter-spacing:-.005em;color:rgba(236,238,240,.72)}
/* INMF + 2026 lockup — 2026 digits = 1/4 of INMF cap height, top-aligned to the cap line (Inter Tight metrics) */
.hero-mark{grid-column:1 / 10;grid-row:3;align-self:end;display:flex;align-items:flex-start;gap:.05em;margin:-.030em 0 -.036em -.035em;font:600 var(--w-mark)/.8 var(--w-display);letter-spacing:-.035em;color:var(--w-t1);white-space:nowrap;
  transform:translateY(calc(24% * var(--p)));opacity:calc(1 - .75 * var(--p))}
.hero-mark .hm-in{display:block}
.hero-mark .hm-year{display:block;margin-top:.058em;font-size:.245em;font-weight:300;line-height:.9;letter-spacing:-.02em;color:rgba(236,238,240,.9)}
.x-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hero-foot{grid-column:10 / 13;grid-row:3;align-self:end}
.hero-meta{display:grid;grid-template-columns:1fr;gap:18px;margin:0 0 26px}
.hero-meta dt{font:500 10px/1 var(--w-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--w-t2);margin:0 0 8px}
.hero-meta dd{margin:0;font:500 15px/1.45 var(--w-kr);color:var(--w-t1)}
.hero-meta dd sup{font-size:.62em;vertical-align:.7em;margin:0 .1em;color:var(--w-t2)}
.hero-meta .loc{display:block;margin-top:6px;font:500 10px/1.4 var(--w-ui);letter-spacing:.2em;color:var(--w-t2)}
.hero-go{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--w-line);border-bottom:1px solid rgba(236,238,240,.55);color:#fff;text-decoration:none;font:500 15px/1.2 var(--w-kr);letter-spacing:-.005em}
.hero-go i{font-style:normal;font-family:var(--w-ui);transition:transform .35s var(--w-ease)}
.hero-go:hover i,.hero-go:focus-visible i{transform:translateX(6px)}
.meridian{position:absolute;z-index:1;left:72%;width:1px;pointer-events:none}
.hero .meridian{top:50%;bottom:0;background:linear-gradient(180deg,rgba(95,195,228,0),rgba(95,195,228,.42))}
.scroll-cue{position:absolute;z-index:3;left:72%;bottom:var(--w-hb);transform:translateX(calc(-100% - 14px));display:flex;align-items:center;background:none;border:0;padding:4px 0;color:var(--w-t2);font:500 10px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}

/* ---------- about (scene 02) ---------- */
.intro{position:relative;overflow:hidden;isolation:isolate;background:var(--w-ink);color:var(--w-t1);padding:clamp(104px,15vh,168px) 0 clamp(104px,14vh,168px)}
.intro::before{content:'';position:absolute;z-index:1;left:0;right:0;top:0;height:30%;pointer-events:none;background:linear-gradient(180deg,var(--w-ink) 0%,rgba(7,9,13,0) 100%)}
.intro .meridian{z-index:2;top:0;height:min(30%,300px);background:linear-gradient(180deg,rgba(95,195,228,.42),rgba(95,195,228,0))}
.intro-kv{position:absolute;z-index:0;top:-6%;right:-14%;width:min(86vw,1300px);aspect-ratio:1500/1221;opacity:.34;
  -webkit-mask-image:radial-gradient(50% 32% at 72% 26%,#000 0%,transparent 100%);mask-image:radial-gradient(50% 32% at 72% 26%,#000 0%,transparent 100%)}
.intro-stage{position:relative;z-index:2;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad)}
.intro-folio{grid-column:1 / 3;grid-row:1;margin:.9em 0 0;display:flex;gap:12px;font:500 11px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t2)}
.intro-folio b{font-weight:500;color:var(--w-cyan)}
.intro-msg{grid-column:3 / 12;grid-row:1;margin:0;font:500 clamp(34px,4.3vw,64px)/1.24 var(--w-kr);letter-spacing:-.035em;color:var(--w-t1);word-break:keep-all}
.intro-msg span{display:block}
.intro-msg .m1{color:var(--w-t2)}
.intro-trans{grid-column:3 / 12;grid-row:2;margin:22px 0 0;font:500 11px/1.5 var(--w-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--w-t3)}
.intro-purpose{grid-column:3 / 8;grid-row:3;margin-top:var(--w-s6)}
.intro-lead{margin:0;font:500 clamp(19px,1.55vw,22px)/1.55 var(--w-kr);letter-spacing:-.015em;color:var(--w-t1)}
.intro-text{margin:16px 0 0;font:400 15px/1.8 var(--w-kr);color:var(--w-t2)}
.intro-links{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:32px}
.intro-links a{display:inline-flex;gap:8px;color:var(--w-t1);text-decoration:none;font:500 14px/1 var(--w-kr);padding-bottom:6px;border-bottom:1px solid rgba(236,238,240,.32);transition:border-color .2s ease}
.intro-links a:hover{border-color:var(--w-t1)}
.intro-meaning{grid-column:9 / 13;grid-row:3;margin-top:calc(var(--w-s6) + 56px);border-top:1px solid var(--w-line);padding-top:16px}
.intro-label{margin:0 0 14px;font:500 10px/1 var(--w-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--w-t2)}
.intro-tag{margin:0;font:500 17px/1.55 var(--w-kr);letter-spacing:-.01em;color:var(--w-t1)}
.intro-facts{margin:22px 0 0;display:grid;gap:14px}
.intro-facts dt{font:500 10px/1 var(--w-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--w-t3);margin:0 0 6px}
.intro-facts dd{margin:0;font:400 14px/1.6 var(--w-kr);color:var(--w-t2)}
.intro-facts .desc{display:block;margin-top:4px;font:500 10px/1.5 var(--w-ui);letter-spacing:.16em;color:var(--w-t3)}
.intro-scale{grid-column:3 / 13;grid-row:4;margin:var(--w-s6) 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--w-gut)}
.intro-scale>div{border-top:1px solid var(--w-line);padding-top:20px}
.intro-scale dt{margin:0;font:300 clamp(64px,7.4vw,124px)/.9 var(--w-display);letter-spacing:-.04em;color:var(--w-t1)}
.intro-scale dd{margin:18px 0 0;font:400 14px/1.6 var(--w-kr);color:var(--w-t2)}
.intro-scale .dday{display:block;margin-top:6px;font:500 10px/1 var(--w-ui);letter-spacing:.16em;color:var(--w-t3)}

/* ---------- motion ---------- */
.js-motion [data-reveal]{opacity:0;transform:translateY(16px);transition:opacity var(--w-dur) var(--w-ease),transform var(--w-dur) var(--w-ease);transition-delay:calc(var(--i,0) * 80ms)}
.js-motion [data-reveal].is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){
  .kv-in{animation:kvBreath 26s ease-in-out infinite alternate}
  @keyframes kvBreath{from{transform:scale(1)}to{transform:scale(1.035)}}
  .kv-pt::before{animation:sonarRing var(--pd,4.4s) cubic-bezier(.25,.6,.3,1) var(--po,0s) infinite}
  .kv-pt::after{animation:sonarGlow var(--pd,4.4s) ease-in-out var(--po,0s) infinite}
  @keyframes sonarRing{0%{opacity:0;transform:scale(.25)}12%{opacity:.55}70%,100%{opacity:0;transform:scale(1.25)}}
  @keyframes sonarGlow{0%,100%{opacity:0}30%{opacity:.8}60%{opacity:0}}
  .hero-mark .hm-in,.hero-mark .hm-year{animation:markRise 1.6s cubic-bezier(.16,.8,.2,1) .15s both}
  .hero-mark .hm-year{animation-delay:.45s}
  @keyframes markRise{from{opacity:0;transform:translateY(22%)}to{opacity:1;transform:none}}
  .hero-cap,.hero-foot{animation:xFade 1.2s var(--w-ease) both}
  .hero-cap{animation-delay:.5s}.hero-foot{animation-delay:.8s}
  @keyframes xFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hero .meridian{transform-origin:top;animation:lineDraw 1.6s var(--w-ease) 1s both}
  @keyframes lineDraw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
}

/* ---------- tablet ---------- */
@media (max-width:1020px){
  .hero-kv{left:14%;height:100%;top:0}
  .hero::before{background:linear-gradient(0deg,var(--w-ink) 0%,rgba(7,9,13,0) 18%),linear-gradient(270deg,rgba(7,9,13,.88) 0%,rgba(7,9,13,.62) 32%,rgba(7,9,13,0) 58%)}
  .hero-stage{grid-template-rows:auto 1fr auto auto}
  .hero-cap{grid-column:1 / 10}
  .hero-foot{grid-column:1 / 13;grid-row:4;margin-top:36px}
  .hero-meta{grid-template-columns:1fr 1fr;gap:0 24px;margin-bottom:22px}
  .hero-mark{grid-column:1 / 13;font-size:27vw}
  .scroll-cue,.hero .meridian,.intro .meridian{display:none}
  .intro-folio{grid-column:1 / 13;grid-row:1;margin:0 0 28px}
  .intro-msg{grid-column:1 / 13;grid-row:2}
  .intro-trans{grid-column:1 / 13;grid-row:3}
  .intro-purpose{grid-column:1 / 8;grid-row:4}
  .intro-meaning{grid-column:8 / 13;grid-row:4}
  .intro-scale{grid-column:1 / 13;grid-row:5}
}

/* ---------- mobile: its own composition ---------- */
@media (max-width:760px){
  .gnb .wrap{gap:12px}
  .tools{gap:10px}
  .lang button{font-size:10px;letter-spacing:.1em;padding:6px 5px;opacity:.3}
  .lang button[aria-pressed="true"]{opacity:.72}
  .hero{--w-mark:28.5vw;min-height:100vh;min-height:100svh}
  .hero-kv{top:calc(var(--w-gh) - 8px);left:-40%;height:64%;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 52%,transparent 96%);mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 52%,transparent 96%)}
  .hero-kv::after{display:none}
  .hero::before{background:linear-gradient(0deg,var(--w-ink) 0%,rgba(7,9,13,0) 16%)}
  .kv-pt.d-only{display:none}
  .hero-stage{display:flex;flex-direction:column;padding:calc(var(--w-gh) + 20px) var(--w-pad) 28px}
  .hero-stage>*{align-self:stretch}
  .hero-mark{order:1;margin:auto 0 -.036em -.035em;font-size:var(--w-mark)}
  .hero-cap{order:2;margin-top:24px}
  .hero-l3{font-size:10.5px;letter-spacing:.18em}
  .hero-l3::before{width:20px}
  .hero-l4{margin:10px 0 0 34px;font-size:14px}
  .hero-foot{order:3;margin-top:26px}
  .hero-meta{grid-template-columns:1fr 1fr;gap:0 18px;padding-top:16px;border-top:1px solid var(--w-line)}
  .hero-meta dd{font-size:13.5px}
  .hero-go{padding:16px 0}
  .intro{padding:88px 0 96px}
  .intro-kv{top:-2%;right:-60%;width:170vw;opacity:.28}
  .intro-stage{display:flex;flex-direction:column}
  .intro-folio{margin:0 0 28px}
  .intro-msg{font-size:clamp(28px,8.6vw,36px);line-height:1.3}
  .intro-trans{margin-top:16px;letter-spacing:.14em}
  .intro-purpose,.intro-meaning{margin-top:56px}
  .intro-meaning{margin-top:48px}
  .intro-scale{margin-top:56px;grid-template-columns:1fr;row-gap:28px}
  .intro-scale dt{font-size:64px}
}

/* ---------- global network (scene 03) ---------- */
.net{position:relative;overflow:hidden;isolation:isolate;background:var(--w-ink);color:var(--w-t1);padding:clamp(96px,13vh,152px) 0 clamp(88px,12vh,136px)}
.net-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad);align-items:end}
.net-folio{grid-column:1 / 3;align-self:start;margin:.9em 0 0;display:flex;gap:12px;font:500 11px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t2)}
.net-folio b{font-weight:500;color:var(--w-cyan)}
.net-title{grid-column:3 / 9;margin:0;font:500 clamp(28px,2.9vw,44px)/1.3 var(--w-kr);letter-spacing:-.03em;color:var(--w-t1);word-break:keep-all}
.net-lead{grid-column:9 / 13;margin:0;font:400 14px/1.75 var(--w-kr);color:var(--w-t2)}
/* the map is the protagonist: full-bleed, no graticule, edges dissolve into the ink */
.net-map{position:relative;margin-top:clamp(40px,6vh,72px)}
.net-map svg{display:block;width:100%;height:auto;overflow:visible;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 7%,#000 93%,transparent 100%)}
.map-land{fill:rgba(111,143,168,.17);stroke:rgba(150,175,198,.22);stroke-width:.4}
.cw-meridian{stroke:var(--w-cyan);stroke-opacity:.28;stroke-width:1;vector-effect:non-scaling-stroke}
.route{fill:none;stroke:var(--w-steel);stroke-opacity:.22;stroke-width:.8;vector-effect:non-scaling-stroke;transition:stroke-opacity .35s ease,stroke .35s ease}
.route.neg{stroke-opacity:.14;stroke-dasharray:2 4}
.route.on{stroke:var(--w-t1);stroke-opacity:.75}
.pt{cursor:pointer;outline:none}
.pt .hit{fill:transparent}
.pt .dot{fill:var(--w-red);r:2.7;transition:r .25s var(--w-ease),fill .25s ease}
.pt.neg .dot{fill:var(--w-ink);stroke:var(--w-steel);stroke-width:1.2;vector-effect:non-scaling-stroke;r:3}
.pt .pulse{fill:none;stroke:rgba(255,112,98,.7);stroke-width:1;vector-effect:non-scaling-stroke;opacity:0;transform-box:fill-box;transform-origin:center}
.pt text{fill:var(--w-t1);font:500 9px var(--w-kr);letter-spacing:-.01em;paint-order:stroke;stroke:var(--w-ink);stroke-width:3px;opacity:0;pointer-events:none;transition:opacity .2s ease}
.pt:hover text,.pt:focus-visible text,.pt.on text{opacity:1}
.pt:hover .dot,.pt:focus-visible .dot,.pt.on .dot{r:4.2}
.pt.op.on .dot{fill:#fff;stroke:var(--w-red);stroke-width:2;vector-effect:non-scaling-stroke}
.pt:focus-visible .hit{stroke:var(--w-cyan);stroke-width:1;vector-effect:non-scaling-stroke}
.home-pt .core{fill:var(--w-cyan)}
.home-pt .ring{fill:none;stroke:var(--w-cyan);stroke-opacity:.6;stroke-width:1;vector-effect:non-scaling-stroke}
.home-pt text{fill:var(--w-cyan);font:500 7.5px var(--w-ui);letter-spacing:.2em}
/* key data as graphic typography inside the map */
.net-figs{position:absolute;inset:0;pointer-events:none}
.net-fig{position:absolute;display:grid;gap:6px;margin:0}
.net-fig dt{font:300 clamp(46px,5vw,84px)/.86 var(--w-display);letter-spacing:-.04em;color:rgba(236,238,240,.92)}
.net-fig .u{display:block;font:500 10px/1.4 var(--w-ui);letter-spacing:.2em;color:var(--w-t1)}
.net-fig .s{display:block;font:400 12.5px/1.5 var(--w-kr);color:var(--w-t2)}
.net-fig dd{margin:4px 0 0;padding-left:1px}
/* foot: legend + readout */
.net-foot{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad);margin-top:clamp(24px,4vh,44px);align-items:start}
.net-legend{grid-column:3 / 8;display:flex;flex-wrap:wrap;gap:10px 26px;margin:0;padding-top:16px;border-top:1px solid var(--w-line);font:400 12.5px/1.4 var(--w-kr);color:var(--w-t2)}
.net-legend span{display:inline-flex;align-items:center;gap:9px}
.net-legend i{flex:none;width:7px;height:7px;border-radius:50%}
.net-legend .k-op{background:var(--w-red)}
.net-legend .k-neg{border:1.2px solid var(--w-steel)}
.net-legend .k-home{background:var(--w-cyan);box-shadow:0 0 0 3px var(--w-ink),0 0 0 4px rgba(95,195,228,.6)}
.net-readout{grid-column:8 / 13;min-height:118px;padding-top:16px;border-top:1px solid rgba(236,238,240,.4)}
.ro-k{margin:0 0 10px;font:500 10px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t2)}
.ro-k.op{color:#FF8A7E}
.ro-n{margin:0;font:500 21px/1.35 var(--w-kr);letter-spacing:-.02em;color:var(--w-t1)}
.ro-d{margin:8px 0 0;font:400 13.5px/1.7 var(--w-kr);color:var(--w-t2)}
.net-list{display:none}
.js-motion .net-map .map-land{opacity:0;transition:opacity 1.4s ease}
.js-motion .net-map .cw-meridian{transform-box:fill-box;transform-origin:top;transform:scaleY(0);transition:transform 1.6s var(--w-ease) .2s}
.js-motion .net-map .pt,.js-motion .net-map .home-pt{opacity:0;transition:opacity .7s var(--w-ease);transition-delay:calc(.6s + var(--i,0) * 35ms)}
.js-motion .net-map .route:not(.neg){stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--w-ease),stroke-opacity .35s ease,stroke .35s ease;transition-delay:calc(1.3s + var(--i,0) * 45ms),0s,0s}
.js-motion .net-map .route.neg{opacity:0;transition:opacity 1s ease 2.2s}
.js-motion .net-fig{opacity:0;transform:translateY(12px);transition:opacity 1s var(--w-ease),transform 1s var(--w-ease);transition-delay:calc(2.3s + var(--i,0) * 160ms)}
.js-motion .net-map.is-in .map-land,.js-motion .net-map.is-in .pt,.js-motion .net-map.is-in .home-pt,.js-motion .net-map.is-in .route.neg,.js-motion .net-map.is-in .net-fig{opacity:1;transform:none}
.js-motion .net-map.is-in .cw-meridian{transform:none}
.js-motion .net-map.is-in .route:not(.neg){stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){
  .net-map.is-in .pt .pulse{animation:sonarSvg var(--pd,4.6s) cubic-bezier(.25,.6,.3,1) calc(3s + var(--po,0s)) infinite}
  @keyframes sonarSvg{0%{opacity:0;transform:scale(.4)}12%{opacity:.6}70%,100%{opacity:0;transform:scale(2.6)}}
}
@media (max-width:1020px){
  .net-folio{grid-column:1 / 13;margin:0 0 24px}
  .net-title{grid-column:1 / 13}
  .net-lead{grid-column:1 / 10;margin-top:18px}
  .net-legend{grid-column:1 / 7}
  .net-readout{grid-column:7 / 13}
  .net-fig dt{font-size:5.4vw}
  .net-fig .s{display:none}
}
@media (max-width:760px){
  .net{padding:88px 0 96px}
  .net-head{display:block}
  .net-title{font-size:27px;line-height:1.35}
  .net-lead{margin-top:16px}
  .net-map{margin-top:36px}
  .net-map svg{width:116%;margin-left:-8%}
  .pt .dot{r:6}
  .pt.neg .dot{r:6.4}
  .home-pt .core{r:6}.home-pt .ring{r:13}
  .home-pt text{display:none}
  .pt text{display:none}
  .net-figs{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px;padding:0 var(--w-pad);margin-top:28px}
  .net-fig{position:static;padding-top:14px;border-top:1px solid var(--w-line)}
  .net-fig dt{font-size:44px}
  .net-fig .s{display:block;font-size:11.5px}
  .net-fig .u{font-size:9px;letter-spacing:.16em}
  .net-foot{display:block;margin-top:36px}
  .net-legend{display:none}
  .net-readout{min-height:0;border-top-color:rgba(236,238,240,.3)}
  .net-list{display:block;padding:0 var(--w-pad);margin-top:32px}
  .nl-g{padding:18px 0 6px;border-top:1px solid var(--w-line)}
  .nl-h{margin:0 0 10px;font:500 10px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t2)}
  .nl-g ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .net-c{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:none;border:0;padding:0;color:var(--w-t1);font:400 15px/1.3 var(--w-kr);text-align:left;cursor:pointer}
  .net-c::before{content:'';flex:none;width:7px;height:7px;border-radius:50%;background:var(--w-red)}
  .net-c.neg{color:var(--w-t2)}
  .net-c.neg::before{background:none;border:1.2px solid var(--w-steel)}
  .net-c[aria-pressed="true"]{color:#fff;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
}

/* ---------- sections ---------- */

/* ---------- lifecycle (scene 04): one wake line, sticky stage, native scroll ---------- */
.life{--lf:0;position:relative;background:var(--w-ink);color:var(--w-t1)}
.life-track{position:relative;height:220vh}
.life-stick{position:sticky;top:0;height:100vh;min-height:640px;overflow:hidden}
.life-conv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:calc(1 - var(--lf) * 5)}
.life-conv path{fill:none;stroke:var(--w-steel);stroke-opacity:.26;stroke-width:.8;vector-effect:non-scaling-stroke}
.life-folio{position:absolute;top:calc(var(--w-gh) + clamp(40px,7vh,80px));left:var(--w-pad);margin:0;display:flex;gap:12px;font:500 11px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t2)}
.life-folio b{font-weight:500;color:var(--w-cyan)}
.life-count{position:absolute;top:calc(var(--w-gh) + clamp(40px,7vh,80px));right:var(--w-pad);margin:0;font:500 11px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-t3)}
.life-count b{font-weight:500;color:var(--w-t1)}
.life-rail{position:absolute;left:var(--w-pad);right:var(--w-pad);top:55%;height:0}
.ll-base,.ll-fill{position:absolute;left:0;top:0;height:1px}
.ll-base{right:0;background:rgba(170,188,208,.2)}
.ll-fill{width:calc(var(--lf) * 100%);background:rgba(236,238,240,.72)}
.ll-head{position:absolute;top:0;left:calc(var(--lf) * 100%);width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--w-cyan);box-shadow:0 0 0 5px rgba(7,9,13,1),0 0 0 6px rgba(95,195,228,.5)}
.life-steps{list-style:none;margin:0;padding:0}
.ls{position:absolute;top:0;left:calc(var(--x) * 100%)}
.ls::before{content:'';position:absolute;left:0;top:-5px;width:1px;height:10px;background:rgba(236,238,240,.2);transition:background-color .5s ease}
.ls-en{position:absolute;left:0;bottom:22px;white-space:nowrap;font:400 clamp(26px,2.6vw,40px)/.95 var(--w-display);letter-spacing:-.015em;color:rgba(236,238,240,.26);transition:color .6s var(--w-ease)}
.ls-ko{position:absolute;left:0;top:22px;white-space:nowrap;font:500 14px/1.5 var(--w-kr);color:rgba(236,238,240,.30);transition:color .6s var(--w-ease)}
.ls-key .ls-en{font-size:clamp(88px,9.8vw,160px);font-weight:500;letter-spacing:-.045em;line-height:.78;bottom:18px}
.ls-key .ls-ko{font-size:16px}
.ls-note{display:block;margin-top:6px;font:500 10px/1.4 var(--w-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--w-t2);opacity:0;transform:translateY(6px);transition:opacity .6s var(--w-ease),transform .6s var(--w-ease)}
.ls.is-past .ls-en{color:rgba(236,238,240,.5)}
.ls.is-past .ls-ko{color:rgba(236,238,240,.5)}
.ls.is-past::before{background:rgba(236,238,240,.5)}
.ls.is-now .ls-en{color:var(--w-t1)}
.ls.is-now .ls-ko{color:var(--w-t1)}
.ls.is-now::before{background:var(--w-t1)}
.ls-key.is-past .ls-en{color:rgba(236,238,240,.66)}
.ls-key.is-now .ls-note,.ls-key.is-past .ls-note{opacity:1;transform:none}
html[lang="ko"] .ls-note{font:500 12.5px/1.5 var(--w-kr);letter-spacing:0}
.life-close{position:absolute;left:calc(var(--w-pad) + (100% - 2 * var(--w-pad)) / 6);bottom:clamp(48px,9vh,96px);max-width:640px;margin:0;font:500 clamp(18px,1.5vw,22px)/1.6 var(--w-kr);letter-spacing:-.015em;color:var(--w-t2);opacity:0;transform:translateY(10px);transition:opacity .8s var(--w-ease),transform .8s var(--w-ease)}
.life[data-now="4"] .life-close{opacity:1;transform:none}
/* ink -> paper: a long, eased band so Program never flashes in */
.band-paper{position:absolute;left:0;right:0;bottom:0;height:34%}
.life-band{position:relative;height:clamp(260px,46vh,440px);background:linear-gradient(180deg,#07090D 0%,#0E1115 18%,#26292D 38%,#6E7072 60%,#B9B8B4 80%,#E2E1DC 92%,#EEEDE8 100%)}

/* ---------- program (scene 05, paper) ---------- */
.prog{background:var(--w-paper);color:var(--w-p1);padding:clamp(40px,6vh,72px) 0 clamp(104px,14vh,168px)}
.prog-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad);align-items:end}
.prog-folio{grid-column:1 / 3;align-self:start;margin:.9em 0 0;display:flex;gap:12px;font:500 11px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-p2)}
.prog-folio b{font-weight:500;color:var(--w-steel)}
.prog-title{grid-column:3 / 9;margin:0;font:500 clamp(30px,3vw,46px)/1.25 var(--w-kr);letter-spacing:-.03em;color:var(--w-p1)}
.prog-lead{grid-column:9 / 13;margin:0;font:400 14px/1.75 var(--w-kr);color:var(--w-p2)}
.pd{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad);margin-top:clamp(64px,9vh,104px)}
.pd-date{grid-column:1 / 4;align-self:start;position:sticky;top:calc(var(--w-gh) + 36px);padding-top:18px}
.pd-date b{display:block;font:300 clamp(88px,9vw,148px)/.78 var(--w-display);letter-spacing:-.05em;color:var(--w-p1)}
.pd-date span{display:block;margin-top:16px;font:500 11px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-p2)}
.pd-date small{display:block;margin-top:8px;font:400 13px/1.4 var(--w-kr);color:var(--w-p3)}
.pd-list{grid-column:4 / 13;list-style:none;margin:0;padding:0;border-top:1px solid var(--w-p1)}
.ps{position:relative;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,6fr) minmax(0,2.4fr) 24px;column-gap:var(--w-gut);align-items:baseline;padding:28px 0 30px;border-bottom:1px solid var(--w-line-p);color:inherit;text-decoration:none;transition:border-color .3s ease}
.ps-time{font:500 13px/1.5 var(--w-ui);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--w-p1)}
.ps-time small{display:block;margin-top:4px;font:400 12px/1.4 var(--w-kr);letter-spacing:0;color:var(--w-p3)}
.ps-main{min-width:0}
.ps-name{display:block;font:500 clamp(19px,1.6vw,23px)/1.4 var(--w-kr);letter-spacing:-.02em;color:var(--w-p1);transition:transform .45s var(--w-ease)}
.ps-desc{display:block;margin-top:8px;max-width:38em;font:400 14.5px/1.7 var(--w-kr);color:var(--w-p2)}
.ps-loc{font:400 13px/1.5 var(--w-kr);color:var(--w-p2)}
.ps-loc::before{content:'';display:inline-block;width:12px;height:1px;margin:0 8px 0 0;vertical-align:middle;background:var(--w-steel)}
.ps-go{justify-self:end;font:400 16px/1 var(--w-ui);color:var(--w-p1);opacity:0;transform:translateX(-6px);transition:opacity .35s ease,transform .45s var(--w-ease)}
.ps:hover,.ps:focus-visible{border-bottom-color:var(--w-p1)}
.ps:hover .ps-name,.ps:focus-visible .ps-name{transform:translateX(4px)}
.ps:hover .ps-go,.ps:focus-visible .ps-go{opacity:1;transform:none}
.ps:focus-visible{outline:2px solid var(--w-steel);outline-offset:4px}

@media (max-width:1020px){
  .ls-en{font-size:clamp(22px,2.9vw,30px)}
  .ls-key .ls-en{font-size:clamp(72px,10vw,110px)}
  .prog-folio{grid-column:1 / 13;margin:0 0 24px}
  .prog-title{grid-column:1 / 13}

  .life-track{height:auto}

  .life-conv,.life-count{display:none}

  .ls::before{left:-3px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--w-t2)}

  .ls-key::before{top:1.4em;background:var(--w-cyan)}
  .ls-key .ls-en{font-size:84px;line-height:.82;color:var(--w-t1)}
  .ls-key .ls-ko{margin-top:12px;font-size:16px;color:var(--w-t1)}

  .life-band{height:260px}

}

/* ---------- sub page ---------- */
/* ---------- subpage shell (WAKE F1): ink page hero, 72% meridian, text tabs ---------- */
.ph{position:relative;overflow:hidden;background:var(--w-ink);color:var(--w-t1);padding-top:clamp(56px,9vh,96px)}
.ph-mer{position:absolute;left:72%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,rgba(95,195,228,0),rgba(95,195,228,.34) 60%,rgba(95,195,228,.34));pointer-events:none}
.ph-in{position:relative;padding:0 var(--w-pad)}
.ph-crumb{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:0;font:500 11px/1.4 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t2)}
.ph-crumb b{font-weight:500;color:var(--w-cyan)}
.ph-crumb a{color:var(--w-t2);text-decoration:none;transition:color .2s ease}
.ph-crumb a:hover{color:var(--w-t1)}
.ph-crumb i{font-style:normal;color:var(--w-t3)}
.ph-crumb span{color:var(--w-t1)}
html[lang="ko"] .ph-crumb span{font:500 13px/1.4 var(--w-kr);letter-spacing:0}
.ph-title{max-width:14em;margin:clamp(28px,4vh,40px) 0 0;font:500 clamp(40px,4.4vw,64px)/1.15 var(--w-kr);letter-spacing:-.035em;color:var(--w-t1);word-break:keep-all}
.ph-en{margin:18px 0 0;font:500 11px/1.4 var(--w-ui);letter-spacing:.24em;color:var(--w-t2)}
.ph-lead{max-width:36em;margin:22px 0 0;font:400 16px/1.75 var(--w-kr);color:var(--w-t2)}
.ph-tabs{position:relative;display:flex;gap:0 36px;margin:clamp(56px,8vh,88px) var(--w-pad) 0;border-top:1px solid var(--w-line)}
.ph-tabs a{position:relative;flex:none;padding:18px 0 22px;color:var(--w-t2);text-decoration:none;font:500 14px/1.3 var(--w-kr);letter-spacing:-.01em;transition:color .2s ease}
.ph-tabs a::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:var(--w-cyan);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--w-ease)}
.ph-tabs a:hover{color:var(--w-t1)}
.ph-tabs a[aria-current="page"]{color:var(--w-t1)}
.ph-tabs a[aria-current="page"]::before{transform:none}
.ph-tabs a:focus-visible{outline:2px solid var(--w-cyan);outline-offset:4px}
.ph-band{--bh:clamp(120px,16vh,180px)}
.sp-tail{--bh:clamp(140px,18vh,200px)}
.page{background:var(--w-paper)}

/* ---------- subpage body (WAKE F1): label column + content, hairlines, no cards ---------- */
.sp{background:var(--w-paper);color:var(--w-p1);padding:clamp(24px,4vh,48px) 0 clamp(96px,12vh,144px)}
.sp-sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad)}
.sp-sec+.sp-sec{margin-top:clamp(96px,13vh,144px)}
.sp-label{grid-column:1 / 4;align-self:start;position:sticky;top:calc(var(--w-gh) + 32px);display:flex;gap:12px;margin:0;padding-top:20px;border-top:1px solid var(--w-p1);font:500 11px/1.3 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-p1)}
.sp-label b{font-weight:500;color:var(--w-steel)}
html[lang="ko"] .sp-label span{font:500 13px/1.1 var(--w-kr);letter-spacing:0}
.sp-main{grid-column:4 / 13;min-width:0;padding-top:20px;border-top:1px solid var(--w-line-p)}
.sp-main.sp-flush{padding-top:0;border-top:0}
.sp-h{max-width:22em;margin:0;font:500 clamp(26px,2.5vw,38px)/1.32 var(--w-kr);letter-spacing:-.03em;color:var(--w-p1);word-break:keep-all}
.sp-lead{max-width:40em;margin:18px 0 0;font:400 16.5px/1.8 var(--w-kr);color:var(--w-p2)}
.sp-h3{margin:0;font:500 19px/1.45 var(--w-kr);letter-spacing:-.02em;color:var(--w-p1)}
.sp-block{margin-top:clamp(40px,6vh,64px)}
.sp-note{margin:14px 0 0;font:400 13px/1.6 var(--w-kr);color:var(--w-p3)}
/* definition list (replaces .spec tables) */
.sp-spec{margin:0;border-top:1px solid var(--w-p1)}
.sp-spec>div{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,7fr);column-gap:var(--w-gut);padding:18px 0;border-bottom:1px solid var(--w-line-p)}
.sp-spec dt{font:500 13px/1.7 var(--w-kr);color:var(--w-p2)}
.sp-spec dd{margin:0;min-width:0;font:400 15.5px/1.7 var(--w-kr);color:var(--w-p1)}
.sp-spec dd a{color:inherit;text-decoration:none;border-bottom:1px solid var(--w-line-p);transition:border-color .2s ease}
.sp-spec dd a:hover{border-color:var(--w-p1)}
/* numbered index (replaces .axes / .outcomes / .panel cards) */
.sp-index{--c:3;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:48px var(--w-gut)}
.sp-index>li{min-width:0;padding-top:18px;border-top:1px solid var(--w-p1)}
.sp-index .n{display:block;font:500 11px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-steel)}
.sp-index .t{display:block;margin-top:24px;font:500 19px/1.45 var(--w-kr);letter-spacing:-.02em;color:var(--w-p1)}
.sp-index .t.en{margin-top:28px;font:400 clamp(22px,1.9vw,28px)/1 var(--w-display);letter-spacing:-.02em}
.sp-index .d{display:block;margin-top:12px;font:400 14.5px/1.75 var(--w-kr);color:var(--w-p2)}
/* data table on paper (country table keeps .data for its row selection) */
.sp .scroll{overflow:visible}
.sp .data{min-width:0;background:none;border-top:1px solid var(--w-p1);font:400 14.5px/1.6 var(--w-kr)}
.sp .data th{padding:14px 20px 14px 0;background:none;border-bottom:1px solid var(--w-line-p);font:500 12.5px/1.4 var(--w-kr);color:var(--w-p2)}
.sp .data td{padding:16px 20px 16px 0;border-bottom:1px solid var(--w-line-p);color:var(--w-p1)}
.sp .data td:first-child{font-weight:500}
/* country-table row control: looks like the cell text, reachable by Tab, Enter / Space via the native button */
.sp .data .row-sel{display:inline;padding:0;margin:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}
.sp .data .row-sel:focus-visible{outline:2px solid var(--w-steel);outline-offset:4px}
.sp .data ul{margin:0;padding:0;list-style:none}
.sp .data .none{color:var(--w-p3)}
.sp .data tr[data-c]{cursor:pointer}
.sp .data tr[data-c]:hover td{background:rgba(111,143,168,.08)}
.sp .data tr.sel td{background:rgba(111,143,168,.18)}
/* three-way diagram (background: needs / forum / opportunities) */
.sp-needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--w-gut)}
.sp-needs>div{min-width:0;padding-top:18px;border-top:1px solid var(--w-p1)}
.sp-needs ul{list-style:none;margin:18px 0 0;padding:0}
.sp-needs li{padding:12px 0;border-bottom:1px solid var(--w-line-p);font:500 15px/1.5 var(--w-kr)}
.sp-needs li small{display:block;margin-top:2px;font:400 13px/1.55 var(--w-kr);color:var(--w-p2)}
.sp-needs .mid{border-top-width:2px}
.sp-needs .mid .sp-h3{font-size:21px}
.sp-needs dl{margin:12px 0 0}
.sp-needs dt{margin-top:22px;font:500 11px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-steel)}
.sp-needs dd{margin:8px 0 0;font:500 16px/1.55 var(--w-kr);color:var(--w-p1)}
/* ink plate: short statement inside a paper page */
.sp-plate{position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);margin-top:clamp(96px,13vh,144px);padding:clamp(72px,11vh,128px) var(--w-pad);background:var(--w-ink);color:var(--w-t1)}
.sp-plate .ph-mer{background:linear-gradient(180deg,rgba(95,195,228,.34),rgba(95,195,228,0))}
.sp-plate>div{position:relative;grid-column:4 / 9}
.sp-plate p{margin:0;font:500 clamp(24px,2.5vw,38px)/1.45 var(--w-kr);letter-spacing:-.03em;word-break:keep-all}
.sp-plate .nb{white-space:nowrap}
.sp-plate small{display:block;margin-top:28px;max-width:34em;font:400 15.5px/1.75 var(--w-kr);color:var(--w-t2)}
/* network scene reused on the background page */
.sp-net{padding:clamp(40px,6vh,64px) 0 clamp(64px,9vh,96px)}
.sp-net .net-head{align-items:start}
.sp-net .net-folio{grid-column:1 / 13;margin:0}
.sp-bandin{--bh:clamp(120px,16vh,180px);margin-top:clamp(64px,9vh,104px)}
.sp-bandout{--bh:clamp(120px,16vh,180px)}
/* inside a paper page the dark half of a band must flip the header back to ink */
.band .band-ink{position:absolute;left:0;right:0;height:50%}
.band-to-ink .band-ink{bottom:0}
.band-to-paper .band-ink{top:0}
/* ---------- program subpages (WAKE F2) ---------- */
/* hero meta: DATE / TIME / LOCATION on hairlines */
.ph-meta{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);margin:clamp(40px,6vh,64px) 0 0}
.ph-meta>div{min-width:0;padding-top:16px;border-top:1px solid rgba(236,238,240,.4)}
.ph-meta>div:nth-child(1){grid-column:1 / 3}
.ph-meta>div:nth-child(2){grid-column:3 / 6}
.ph-meta>div:nth-child(3){grid-column:6 / 9}
.ph-meta dt{font:500 10px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-t2)}
.ph-meta dd{margin:12px 0 0;font:500 16px/1.5 var(--w-kr);letter-spacing:-.01em;color:var(--w-t1);word-break:keep-all}

/* schedule toolbar: date index + view switch */
.sch-bar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad)}
.sch-bar>div{grid-column:1 / 13;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px 32px;padding:16px 0;border-top:1px solid var(--w-p1);border-bottom:1px solid var(--w-line-p)}
.sch-days,.sch-view{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px}
.sch-days .k,.sch-view .k{margin-right:6px;font:500 10px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-p3)}
.sch-bar button{padding:6px 0;border:0;border-bottom:1px solid transparent;background:none;color:var(--w-p2);font:400 22px/1 var(--w-display);letter-spacing:-.02em;cursor:pointer;transition:color .2s ease,border-color .2s ease}
.sch-view button{font:500 14px/1.3 var(--w-kr);letter-spacing:0}
.sch-bar button:hover{color:var(--w-p1)}
.sch-bar button[aria-pressed="true"]{color:var(--w-p1);border-bottom-color:var(--w-p1)}
.sch-bar button:focus-visible{outline:2px solid var(--w-steel);outline-offset:3px}
.sp .pd{scroll-margin-top:calc(var(--w-gh) + 16px)}

/* rows shared with the home program (.ps); static rows have no link */
.ps-loc:empty::before{display:none}
.ps.is-static{cursor:default}
.ps.is-static:hover{border-bottom-color:var(--w-line-p)}
.ps.is-static:hover .ps-name{transform:none}
.ps.is-move{padding-top:14px;padding-bottom:16px}
.ps.is-move .ps-name{font-size:14.5px;color:var(--w-p3)}
.ps.is-move .ps-time{color:var(--w-p3)}
.sp-rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--w-p1)}
/* full timetable (secondary view): monochrome, scrolls inside its own box */
.sch-grid{grid-column:1 / 13;min-width:0;margin-top:clamp(32px,5vh,48px);overflow-x:auto;padding:0 var(--w-pad)}
.sp .sgrid{min-width:980px;background:none;font:400 13px/1.35 var(--w-kr)}
.sp .sgrid th,.sp .sgrid td{border:1px solid var(--w-line-p)}
.sp .sgrid thead th,.sp .sgrid thead .tcol{background:var(--w-paper-2);color:var(--w-p1);font:500 13px/1.35 var(--w-kr)}
.sp .sgrid thead th small{color:var(--w-p2)}
.sp .sgrid thead th.room{background:var(--w-paper);color:var(--w-p2);font-size:12px}
.sp .sgrid .tcol{background:var(--w-paper);color:var(--w-p2);font:500 12px/1.3 var(--w-ui)}
.sp .sgrid td.expo{background:rgba(111,143,168,.16);color:var(--w-p1);font-weight:500}
.sp .sgrid td.main{background:var(--w-ink);color:var(--w-t1);border-color:var(--w-paper);border-width:2px}
.sp .sgrid td.main small{color:var(--w-t2)}
.sp .sgrid td.key{background:var(--w-steel);color:#fff;border-color:var(--w-paper);border-width:2px}
.sp .sgrid td.meal{background:var(--w-paper-2);color:var(--w-p1)}
.sp .sgrid td.meal small{color:var(--w-p2)}
.sp .sgrid td.move{background:none;color:var(--w-p3)}
.sp .sgrid td.etc{background:none;color:var(--w-p1);box-shadow:inset 0 0 0 1px var(--w-steel)}
.sp .sgrid td.blk b{font-weight:500}
.sp .sgrid tr.eve .tcol{background:var(--w-paper-2);color:var(--w-p1)}
/* inline noun list (replaces the round pills) */
.sp-inline{list-style:none;display:flex;flex-wrap:wrap;margin:14px 0 0;padding:0;border-top:1px solid var(--w-line-p)}
.sp-inline li{padding:14px 22px 14px 0;margin-right:22px;border-right:1px solid var(--w-line-p);font:500 15px/1.4 var(--w-kr)}
.sp-inline li:last-child{border-right:0}
/* expo call to action */
.sp-cta{display:flex;flex-wrap:wrap;align-items:center;gap:20px 32px}
/* previous / next editorial navigation */
.sp-pn{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad);margin-top:clamp(96px,13vh,144px)}
.sp-pn>div{grid-column:4 / 13;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--w-p1);border-bottom:1px solid var(--w-line-p)}
.sp-pn a{display:flex;flex-direction:column;gap:14px;padding:28px 0 32px;color:var(--w-p1);text-decoration:none;min-width:0}
.sp-pn a.next{align-items:flex-end;text-align:right;padding-left:24px;border-left:1px solid var(--w-line-p)}
.sp-pn a.prev{padding-right:24px}
.sp-pn>div.solo{grid-template-columns:minmax(0,1fr)}
.sp-pn>div.solo a.next{padding-left:0;border-left:0;border-top:0}
.sp-pn .k{font:500 11px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-p2)}
.sp-pn .t{font:500 clamp(19px,1.7vw,24px)/1.35 var(--w-kr);letter-spacing:-.02em}
.sp-pn .k{transition:transform .45s var(--w-ease),color .2s ease}
.sp-pn a:hover .k{color:var(--w-p1)}
.sp-pn .t small{display:block;margin-bottom:6px;font:500 10px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-steel)}
.sp-pn a.prev:hover .k{transform:translateX(-6px)}
.sp-pn a.next:hover .k{transform:translateX(6px)}
.sp-pn a:focus-visible{outline:2px solid var(--w-steel);outline-offset:4px}
@media (max-width:1020px){
  .ph-meta>div:nth-child(1){grid-column:1 / 5}
  .ph-meta>div:nth-child(2){grid-column:5 / 9}
  .ph-meta>div:nth-child(3){grid-column:9 / 13}
  .sp-pn>div{grid-column:1 / 13}
}
@media (max-width:760px){
  .ph-meta{display:block;margin-top:32px}
  .ph-meta>div{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:baseline;gap:12px;padding:12px 0}
  .ph-meta dd{margin:0;font-size:15px}
  
  .sch-bar>div{flex-direction:column;align-items:flex-start;gap:10px}
  .sch-bar button{font-size:20px}
  .sch-view button{font-size:13.5px}
  .sch-grid{padding:0 var(--w-pad)}
  
  .sp .pd-date{top:var(--w-gh)}
  .sp-inline li{padding:10px 14px 10px 0;margin-right:14px;font-size:14px}
  .sp-pn>div{grid-template-columns:minmax(0,1fr)}
  .sp-pn a.next{align-items:flex-start;text-align:left;padding-left:0;border-left:0;border-top:1px solid var(--w-line-p)}
  .sp-pn a{padding:22px 0 24px}
}
/* ---------- exhibitor / visitor subpages (WAKE F3) ---------- */
:root{--w-err:#A0612C;--w-err-ink:#6E3C12}
/* hairline table built from rows (services, transport); stacks into labelled blocks on mobile */
.sp-tbl{border-top:1px solid var(--w-p1)}
.sp-tbl .tr{display:grid;grid-template-columns:var(--cols,repeat(3,minmax(0,1fr)));column-gap:var(--w-gut);padding:16px 0 17px;border-bottom:1px solid var(--w-line-p)}
.sp-tbl .tr.head{padding:12px 0}
.sp-tbl .th{font:500 12.5px/1.4 var(--w-kr);color:var(--w-p2)}
.sp-tbl .td{min-width:0;font:400 15px/1.6 var(--w-kr);color:var(--w-p1)}
.sp-tbl .td:first-child{font-weight:500}
.sp-links{display:flex;flex-wrap:wrap;gap:14px 28px}
/* booth types: two columns split by a hairline, no cards */
.ex-booths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--w-p1)}
.ex-booth{min-width:0;padding:24px var(--w-gut) 8px 0}
.ex-booth+.ex-booth{padding:24px 0 8px var(--w-gut);border-left:1px solid var(--w-line-p)}
.ex-booth .n{display:block;font:500 11px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-steel)}
.ex-fig{display:flex;align-items:flex-end;height:180px;margin:24px 0 0}
.ex-fig img{display:block;height:100%;width:auto;max-width:100%}
.ex-fig svg{display:block;height:100%;width:auto;overflow:visible}
.ex-fig .sq{fill:none;stroke:var(--w-p1);stroke-width:1;vector-effect:non-scaling-stroke}
.ex-fig .dim{stroke:var(--w-steel);stroke-width:1;vector-effect:non-scaling-stroke}
.ex-fig text{fill:var(--w-p2);font:500 9px var(--w-ui);letter-spacing:.12em}
.ex-booth h3{margin:28px 0 0;font:500 21px/1.4 var(--w-kr);letter-spacing:-.02em}
.ex-booth .size{margin:6px 0 0;font:400 14px/1.6 var(--w-kr);color:var(--w-p2)}
.ex-booth .price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:22px 0 0;padding:16px 0;border-top:1px solid var(--w-line-p);border-bottom:1px solid var(--w-line-p)}
.ex-booth .price b{font:300 clamp(32px,3vw,44px)/1 var(--w-display);letter-spacing:-.03em;color:var(--w-p1)}
html[lang="ko"] .ex-booth .price b.kr{font:500 clamp(24px,2.2vw,30px)/1.2 var(--w-kr);letter-spacing:-.02em}
.ex-booth .price small{font:400 13px/1.4 var(--w-kr);color:var(--w-p2)}
.ex-booth .inc{margin:16px 0 0;font:400 14.5px/1.75 var(--w-kr);color:var(--w-p1)}
/* floor plan: full width of the content column, caption only */
.ex-plan{margin:0}
.ex-plan img{display:block;width:100%;height:auto}
.ex-plan figcaption{margin-top:12px;font:400 13px/1.6 var(--w-kr);color:var(--w-p2)}
/* forms on paper: 1px fields, square, paper-2, ink focus, rust errors */
.sp form.f{display:block;background:none;border:0;padding:0}
.sp form.f label,.sp form.f .flabel,.sp form.f legend{display:block;margin:0 0 8px;padding:0;font:500 13px/1.45 var(--w-kr);color:var(--w-p1)}
.sp form.f .req{margin-left:3px;color:var(--w-steel)}
.sp form.f :is(input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea){box-sizing:border-box;display:block;width:100%;min-width:0;height:48px;padding:0 14px;border:1px solid rgba(17,20,24,.3);border-radius:0;background:var(--w-paper-2);color:var(--w-p1);font:400 15px/1.4 var(--w-kr);transition:border-color .2s ease,box-shadow .2s ease}
.sp form.f textarea{height:auto;min-height:140px;padding:12px 14px;line-height:1.6;resize:vertical}
.sp form.f :is(input,select,textarea):focus{outline:none;border-color:var(--w-p1);box-shadow:inset 0 0 0 1px var(--w-p1)}
.sp form.f input[type=file]{display:block;width:100%;min-width:0;font:400 14px var(--w-kr);color:var(--w-p2)}
.sp form.f input[type=file]::file-selector-button{margin-right:14px;padding:10px 16px;border:1px solid var(--w-p1);border-radius:0;background:none;color:var(--w-p1);font:500 13px var(--w-kr);cursor:pointer}
.sp form.f :is(input[type=checkbox],input[type=radio]){width:17px;height:17px;margin:2px 0 0;flex:none;font:inherit;accent-color:var(--w-p1)}
.sp form.f fieldset{min-width:0;margin:0;padding:0;border:0}
.sp form.f .checks{display:flex;flex-wrap:wrap;gap:12px 28px}
.sp form.f .checks label{display:flex;gap:10px;align-items:flex-start;margin:0;font:400 15px/1.5 var(--w-kr)}
.sp form.f .hint{margin:8px 0 0;font:400 13px/1.6 var(--w-kr);color:var(--w-p2)}
.sp form.f .consent{padding:0;background:none;border-radius:0;font:400 14px/1.75 var(--w-kr);color:var(--w-p2)}
.sp form.f .consent p{margin:0 0 10px}

/* application layout: step list (3 cols, sticky) + form (9 cols) */

.fx-main{grid-column:4 / 13;min-width:0}
.fx-group{min-width:0;padding-bottom:clamp(56px,8vh,86px);scroll-margin-top:calc(var(--w-gh) + 24px)}

.sp .rules{border:0;border-top:1px solid var(--w-line-p);border-bottom:1px solid var(--w-line-p);border-radius:0;background:none}
.sp .rules summary{display:flex;justify-content:space-between;gap:16px;padding:16px 0;font:500 14px/1.4 var(--w-kr);color:var(--w-p1);cursor:pointer;list-style:none}

.sp .articles{padding:0 0 18px;max-height:360px;font:400 13px/1.7 var(--w-kr);color:var(--w-p2)}

/* pre-registration: guidance (left) and form (right) on one grid, no boxes */

/* location map on paper: the Venue map language in paper tones */
.loc-map{margin:0}

.loc-key{display:none;flex-wrap:wrap;gap:6px 20px;margin:10px 0 0;padding:0;list-style:none;font:500 10px/1.4 var(--w-ui);letter-spacing:.16em;color:var(--w-p1)}

.vz-region-label{fill:var(--w-t2);font:500 13px var(--w-ui);letter-spacing:.16em}
.venue-side{grid-column:9 / 13}
.venue-nodes{list-style:none;margin:0;padding:0}
.vn{padding:18px 0 22px;border-top:1px solid var(--w-line)}
.vn:first-child{border-top-color:rgba(236,238,240,.45)}
.vn-k{display:flex;gap:12px;margin:0 0 10px;font:500 10px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-t2)}
.vn-k b{font-weight:500;color:var(--w-t1)}
.vn-name{margin:0;font:500 19px/1.4 var(--w-kr);letter-spacing:-.02em;color:var(--w-t1)}
.vn-sub{display:block;margin-top:2px;font:400 13px/1.5 var(--w-kr);color:var(--w-t2)}
.vn-desc{margin:10px 0 0;font:400 14px/1.7 var(--w-kr);color:var(--w-t2)}
.venue-links{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:26px}
.venue-links a{display:inline-flex;gap:8px;color:var(--w-t1);text-decoration:none;font:500 14px/1 var(--w-kr);padding-bottom:6px;border-bottom:1px solid rgba(236,238,240,.32);transition:border-color .2s ease}
.venue-links a:hover{border-color:var(--w-t1)}
.js-motion .vz-box{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--w-ease) .5s}
.js-motion .vz.is-in .vz-box{stroke-dashoffset:0}

/* ---------- partners (scene 07, paper) ---------- */
.partners{background:var(--w-paper);color:var(--w-p1);padding:clamp(40px,6vh,64px) 0 clamp(96px,13vh,150px)}
.partners-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad)}
.partners-folio{grid-column:1 / 3;margin:0;display:flex;gap:12px;font:500 11px/1 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-p2)}
.partners-folio b{font-weight:500;color:var(--w-steel)}
.tier{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad);margin-top:clamp(40px,6vh,64px)}
.tier-k{grid-column:1 / 4;margin:0;padding-top:20px;border-top:1px solid var(--w-p1);font:500 11px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-p1)}
.tier-k small{display:block;margin-top:9px;font:400 13px/1 var(--w-kr);letter-spacing:0;color:var(--w-p2)}
.tier-logos{grid-column:4 / 13;list-style:none;margin:0;padding:28px 0 0;border-top:1px solid var(--w-line-p);display:flex;flex-wrap:wrap;align-items:center;gap:36px 64px}
.tier-sup .tier-logos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px;align-items:center}
/* logo slots: only height and spacing are set here; official CI files are never filtered, recoloured or faded */
.tier{--lh:56px}
.tier-sup{--lh:44px}
.logo-slot{display:flex;align-items:center;min-height:var(--lh);min-width:0}
.logo{display:block;width:auto;height:auto;max-height:calc(var(--h,var(--lh)) * var(--ls,1));max-width:100%}
.logo-ph{display:flex;align-items:center;min-height:var(--lh);box-sizing:border-box;padding:8px 18px;border:1px solid var(--w-line-p);font:400 13px/1.35 var(--w-kr);color:var(--w-p2);word-break:keep-all}
.tier-host .logo-ph,.tier-org .logo-ph{min-width:220px}
.tier-sup .logo-ph{width:100%}

/* ---------- footer (scene 08, ink) — the wake ends here ---------- */
footer{position:relative;background:var(--w-ink);color:var(--w-t2);font-size:14px;padding:0;overflow:hidden}
.ft{position:relative;padding:clamp(88px,12vh,128px) 0 0}
.ft-meridian{position:absolute;left:72%;top:0;height:clamp(150px,22vh,220px);width:1px;background:linear-gradient(180deg,rgba(95,195,228,0),rgba(95,195,228,.5))}
.ft-meridian::after{content:'';position:absolute;left:-4px;bottom:-4px;width:9px;height:9px;border-radius:50%;border:1px solid var(--w-cyan);box-sizing:border-box}
.ft-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--w-gut);padding:0 var(--w-pad);row-gap:40px}
.ft-name{grid-column:1 / 7;margin:0}
.ft-name b{display:block;font:500 12px/1.6 var(--w-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--w-t1)}
.ft-name span{display:block;margin-top:10px;font:500 15px/1.5 var(--w-kr);color:var(--w-t1)}
.ft-name small{display:block;margin-top:6px;font:400 13px/1.6 var(--w-kr);color:var(--w-t2)}
.ft-col{margin:0}
.ft-col dt{margin:0 0 10px;font:500 10px/1 var(--w-ui);letter-spacing:.2em;color:var(--w-t3)}
.ft-col dd{margin:0 0 4px;font:400 13.5px/1.6 var(--w-kr);color:var(--w-t2)}
.ft-col a{color:var(--w-t1);text-decoration:none;border-bottom:1px solid rgba(236,238,240,.25)}
.ft-col a:hover{border-color:var(--w-t1)}
.ft-org{grid-column:7 / 10}
.ft-sec{grid-column:10 / 13}
.ft-nav{grid-column:1 / 13;display:flex;flex-wrap:wrap;gap:10px 30px;padding-top:22px;border-top:1px solid var(--w-line)}
.ft-nav a{font:500 11px/1 var(--w-ui);letter-spacing:.18em;color:var(--w-t2);text-decoration:none}
.ft-nav a:hover{color:var(--w-t1)}
.ft-nav .reg{margin-left:auto;color:var(--w-t1)}
html[lang="ko"] .ft-nav .reg{font:500 13px/1 var(--w-kr);letter-spacing:0}
.ft-mark{display:flex;align-items:flex-start;gap:.05em;margin:clamp(56px,8vh,96px) 0 0;padding:0 var(--w-pad);font:600 clamp(120px,23.5vw,390px)/.8 var(--w-display);letter-spacing:-.035em;color:var(--w-t1);white-space:nowrap;user-select:none}
.ft-mark span{margin-top:.058em;font-size:.245em;font-weight:300;line-height:.9;letter-spacing:-.02em;color:rgba(236,238,240,.9)}
.ft-copy{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px var(--w-pad) 28px;margin-top:18px;border-top:1px solid var(--w-line);font:400 12px/1.5 var(--w-ui);color:var(--w-t3)}

@media (max-width:1020px){
  .venue-word{grid-column:1 / 13}
  .venue-folio{grid-column:1 / 13;margin:0 0 22px}
  .venue-lead{grid-column:1 / 13}
  .venue-access{grid-column:1 / 10;margin-top:14px}
  .vz-small{grid-column:1 / 13;grid-template-columns:1fr 1fr;margin-bottom:32px}
  .vz-detail{grid-column:1 / 13}
  .venue-side{grid-column:1 / 13;margin-top:36px}
  .tier-k{grid-column:1 / 13;border-top:0;padding-top:0;margin-bottom:18px}
  .tier-logos{grid-column:1 / 13;border-top:1px solid var(--w-p1)}
  .tier-sup .tier-logos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ft-name{grid-column:1 / 13}
  .ft-org{grid-column:1 / 7}
  .ft-sec{grid-column:7 / 13}
  .ft-meridian{display:none}
}
@media (max-width:760px){
  .venue-word{font-size:13.55vw}
  .venue-lead{font-size:20px}
  .vz-small{gap:16px}
  .vz-node text{display:none}
  .vz-node text.n{display:block;font-size:34px;fill:var(--w-t1)}
  .vz-region-label{font-size:28px}
  .tier{--lh:48px;--ls:.86}
  .tier-sup{--lh:40px}
  .tier-logos{flex-direction:column;align-items:flex-start;gap:28px}
  .tier-host .logo-ph,.tier-org .logo-ph{width:100%;min-width:0}
  .tier-sup .tier-logos{grid-template-columns:repeat(2,minmax(0,1fr));gap:33px 14px;align-items:center}
  .logo-ph{padding:8px 14px;font-size:12.5px}
  .ft-org,.ft-sec{grid-column:1 / 13}
  .ft-nav{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
  .ft-nav .reg{grid-column:1 / -1;margin:6px 0 0;font-size:12px}
  .ft-mark{font-size:30vw}
}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

function arcPath(a, b){ // great circle Changwon -> country

  const A = v(a), B = v(b), w = Math.acos(Math.min(1, A[0]*B[0]+A[1]*B[1]+A[2]*B[2]));
  let d = '', prev = null;
  for (let i = 0; i <= 40; i++){
    const f = i/40, s1 = Math.sin((1-f)*w)/Math.sin(w), s2 = Math.sin(f*w)/Math.sin(w);
    const x = s1*A[0]+s2*B[0], y = s1*A[1]+s2*B[1], z = s1*A[2]+s2*B[2];
    const p = eeProj(Math.atan2(y, x)/r, Math.atan2(z, Math.hypot(x, y))/r);
    d += (prev && Math.abs(p[0]-prev[0]) < 400 ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); prev = p;
  }
  return d;
}
const PULSE = { PHL:[4.6,0], EGY:[5.2,1.6], PER:[4.8,3.1], NZL:[5.6,2.2] };
function mapSVG(opts = {}){
  const [hx, hy] = eeProj(HOME.lon, HOME.lat);
  let routes = '', pts = '';
  C.forEach((c, i) => {
    const [x, y] = eeProj(c.lon, c.lat);
    routes += `<path class="route${c.st==='neg'?' neg':''}${state.country===c.code?' on':''}" data-c="${c.code}" pathLength="1" style="--i:${i}" d="${arcPath(HOME, c)}"/>`;
    const name = esc(c[state.lang]), right = x > 900;
    const pulse = opts.pulse && PULSE[c.code] ? `<circle class="pulse" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" style="--pd:${PULSE[c.code][0]}s;--po:${PULSE[c.code][1]}s"/>` : '';
    pts += `<g class="pt ${c.st}${state.country===c.code?' on':''}" data-c="${c.code}" tabindex="0" role="button" aria-label="${name}" style="--i:${i}">
      <circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9"/>${pulse}<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.7"/>
      <text x="${(right ? x-8 : x+8).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${right?'end':'start'}">${name}</text></g>`;
  });
  const home = `<g class="home-pt" style="--i:0"><circle class="ring" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="7"/><circle class="core" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="3"/>

}

function spPrevNext(secId, subId){
  // linear reading order: the first page has no PREVIOUS, the last page ends on HOME
  const flat = NAV.flatMap(n => n.subs.map(s => [n, s]));
  const i = flat.findIndex(([n, s]) => n.id === secId && s[0] === subId), L = state.lang==='ko'?0:1;
  const cell = ([n, s], dir) => `<a class="${dir}" href="#/${n.id}/${s[0]}"><span class="k">${dir === 'prev' ? '← PREVIOUS' : 'NEXT →'}</span><span class="t">${n.id !== secId ? `<small>${n.label}</small>` : ''}${esc(s[1][L])}</span></a>`;
  const prev = i > 0 ? cell(flat[i - 1], 'prev') : '';
  const next = i < flat.length - 1 ? cell(flat[i + 1], 'next') : `<a class="next" href="#/"><span class="k">NEXT →</span><span class="t"><small>HOME</small>INMF 2026</span></a>`;
  return `<nav class="sp-pn" aria-label="${k('이전·다음 페이지','Previous and next page')}"><div${prev ? '' : ' class="solo"'}>${prev}${next}</div></nav>`;
}

const RULES = [
 [['용어의 정의','Definitions'],[['“전시자”라 함은 본 『국제 해군 군수 및 MRO 협력 포럼 - 해양군수산업전』 전시 참가를 위하여 소정의 참가 신청서를 제출한 개인, 회사, 조합 및 단체 등의 전시참가 신청자를 말한다. “전시회”라 함은 상기명의 오프라인 전시회를 말한다.','“Exhibitor” means any individual, company, association or organization that has submitted the application form to exhibit at the International Naval Logistics & MRO Cooperation Forum – Naval Logistics Expo. “Exhibition” means the offline exhibition named above.'],['“주최자”라 함은 상기명의 전시회 주최기관 및 주관사를 말한다.','“Organizer” means the host institutions and managing organizers of the Exhibition.']]],
 [['참가신청 및 계약','Application and contract'],[['전시회 참가신청을 하고자 하는 자는 소정의 참가신청서를 작성하여 주최자에게 제출하고, 확정통보 후 본 전시회 참가계약은 성립된 것으로 본다.','Applicants submit the application form to the Organizer. The participation contract is concluded once the Organizer confirms participation.']]],
 [['전시면적 배정','Space allocation'],[['주최자는 신청서와 전시내용에 따라 참가여부를 확정통보하고 전시위치를 배정한다.','The Organizer confirms participation and allocates stand locations based on the application and exhibits.'],['주최자는 전시회장의 공간조화와 관람효율 및 전시효과 등을 고려 전반적인 전시장 운영상 필요하다고 인정할 경우, 전시자에게 배정된 전시위치를 변경할 수 있다. 이와 같은 변경은 주최자의 재량이며, 전시자는 동 변경의 결과에 대한 이의를 제기할 수 없다.','Where necessary for layout, visitor flow or overall operation, the Organizer may change an allocated location at its discretion, and the Exhibitor may not object to the change.']]],
 [['전시회장 관리','Stand management'],[['전시자는 참가신청서에 명시한 전시품을 전시하고 상주요원을 배치하여 자사부스(Booth) 관리에 만전을 기하여야 한다.','Exhibitors display the exhibits stated in the application and keep staff at the stand at all times.'],['전시자가 참가신청서에 명시한 전시품과 상이한 물품을 전시하거나 전시성격에 부합되지 않은 물품을 전시할 경우 또는 주최자의 허가없이 부당행위를 하는 경우 및 타사의 전시에 피해를 주는 행위를 할 경우 주최자는 즉시 부스 중지, 철거 또는 반출을 명할 수 있다. 전시자는 이에 따른 배상을 청구할 수 없다.','If an Exhibitor displays items other than those stated or unsuited to the Exhibition, acts improperly without permission, or harms other exhibitors, the Organizer may immediately suspend, dismantle or remove the stand, without compensation.'],['주최자는 필요한 경우 특정인의 전시회장 출입을 제한할 수 있다.','The Organizer may restrict any person’s entry to the venue where necessary.'],['전시자는 주최자의 서면 동의없이 배정된 전시면적의 전부 또는 일부를 타인에게 양도할 수 없다.','Exhibitors may not transfer all or part of their space to others without the Organizer’s written consent.'],['전시자는 제공되는 기본부스 및 시설물의 원상변형을 할 수 없으며, 전시장치의 손상에 대해서 원상복구 등 주최자의 손해를 배상하여야 한다.','Exhibitors may not alter the shell scheme or facilities provided, and must restore or compensate for any damage.']]],
 [['참가비 납부','Payment'],[['전시자는 참가신청서를 주최자에게 제출해야 한다.','Exhibitors submit the application form to the Organizer.'],['참가비는 주최자가 정한 시일 내 입금완료 하여야 한다.','Fees must be paid in full by the dates set by the Organizer.']]],
 [['계약의 해지','Termination'],[['전시자가 배정된 전시부스의 전부 또는 일부의 사용을 거부하거나 전시규정을 준수하지 않을 경우 주최자는 일방적으로 참가계약을 해지할 수 있다.','If an Exhibitor refuses to use all or part of its stand or breaches these rules, the Organizer may terminate the contract unilaterally.'],['전시자가 전시계약을 취소하고자 할 경우 반드시 전시회 개시 30일 이전에 주최자에게 서면으로 취소 신청을 하여야 한다.','An Exhibitor wishing to cancel must notify the Organizer in writing at least 30 days before the Exhibition opens.'],['전시회 개시 전 30일 이후에는 원칙적으로 전시회 참가계약을 취소할 수 없다.','In principle, the contract cannot be cancelled within 30 days of opening.']]],

/* ================= router ================= */
function route(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const key = P[h] ? h : 'home';
  const sec = key === 'home' ? '' : key.split('/')[0];
  document.documentElement.lang = state.lang;
  document.documentElement.classList.toggle('is-home', key === 'home');
  document.title = k('2026 국제 해군 군수 및 MRO 협력 포럼','2026 International Naval Logistics & MRO Cooperation Forum');
  renderHeader(sec);
  document.getElementById('app').innerHTML = P[key]();
  renderFooter();
  const td=document.getElementById('today'); if (td){ const d=new Date(); td.textContent = d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; }
  updateGnbScrolled();
  initReveal();
  // on narrow screens the tab row scrolls: bring the current tab into view
  const tabs = document.querySelector('.ph-tabs'), cur = tabs && tabs.querySelector('[aria-current]');
  if (cur && tabs.scrollWidth > tabs.clientWidth) tabs.scrollLeft = Math.max(0, cur.offsetLeft - tabs.offsetLeft - 20);
}
let lastHash = location.hash;
window.addEventListener('hashchange', () => {
  const same = location.hash.split('/').slice(0,3).join('/') === lastHash.split('/').slice(0,3).join('/');
  lastHash = location.hash;
  route();
  if (!same) window.scrollTo(0, 0);
});
/* header background state on scroll (transparent-over-hero on home, solid elsewhere) */
function updateGnbScrolled(){
  const root = document.documentElement;
  root.classList.toggle('scrolled', window.scrollY > 8);
  const mid = (parseFloat(getComputedStyle(root).getPropertyValue('--w-gh')) || 72) / 2;
  let scene = '';
  document.querySelectorAll('body [data-scene]').forEach(el => { const r = el.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid) scene = el.dataset.scene; });
  if (scene) root.dataset.scene = scene; else delete root.dataset.scene;
  updateLife();
  updateFormSteps();
  const hero = document.querySelector('.hero');
  if (hero && MOTION) hero.style.setProperty('--p', Math.min(1, Math.max(0, window.scrollY / hero.offsetHeight)).toFixed(3));
}
const MOTION = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;
// application form: mark the step whose block has reached the upper third of the viewport
function updateFormSteps(){
  const nav = document.querySelector('.fx-steps'); if (!nav) return;
  const line = window.innerHeight * .35; let cur = 0;
  document.querySelectorAll('.fx-group').forEach((g, i) => { if (g.getBoundingClientRect().top <= line) cur = i; });
  nav.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-current', i === cur ? 'step' : 'false'));
}
function updateLife(){
  const life = document.querySelector('.life'); if (!life) return;
  const steps = [...life.querySelectorAll('.ls')], live = MOTION && window.innerWidth > 760;
  let lf = 1;
  if (live) { const tr = life.querySelector('.life-track'), span = tr.offsetHeight - window.innerHeight; lf = Math.min(1, Math.max(0, -tr.getBoundingClientRect().top / (span * .92))); }
  let now = 0; steps.forEach((s, i) => { if (lf >= parseFloat(s.style.getPropertyValue('--x')) - .002) now = i; });
  if (!live) now = steps.length - 1;
  life.style.setProperty('--lf', lf.toFixed(4));
  steps.forEach((s, i) => { s.classList.toggle('is-past', live && i < now); s.classList.toggle('is-now', !live || i === now); });
  life.dataset.now = now;
  const cnt = life.querySelector('.life-count b'); if (cnt) cnt.textContent = String(now + 1).padStart(2, '0');
}
window.addEventListener('resize', () => updateGnbScrolled());
if (MOTION) document.documentElement.classList.add('js-motion');
let revealIO = null;
function initReveal(){
  const els = document.querySelectorAll('[data-reveal],[data-reveal-stage]');
  if (!MOTION || !('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('is-in')); return; }
  if (revealIO) revealIO.disconnect();
  revealIO = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); revealIO.unobserve(e.target); } }), { threshold: .2, rootMargin: '0px 0px -10% 0px' });
  els.forEach(el => revealIO.observe(el));
}
let gnbTick = false;
window.addEventListener('scroll', () => {
  if (gnbTick) return;
  gnbTick = true;
  requestAnimationFrame(() => { updateGnbScrolled(); gnbTick = false; });
}, { passive: true });

/* ================= interactions ================= */
function selectCountry(code){
  state.country = state.country === code ? null : code;
  document.querySelectorAll('.pt').forEach(p => p.classList.toggle('on', p.dataset.c === state.country));
  document.querySelectorAll('.route').forEach(r => r.classList.toggle('on', r.dataset.c === state.country));
  document.querySelectorAll('.net-c').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === state.country));
  document.querySelectorAll('.data tr[data-c]').forEach(r => { const on = r.dataset.c === state.country; r.classList.toggle('sel', on); const b = r.querySelector('.row-sel'); if (b) b.setAttribute('aria-pressed', on); });
  const ro = document.getElementById('readout'); if (ro) ro.innerHTML = readout(state.country);
}
document.addEventListener('click', e => {
  // skip link: move focus to <main> instead of letting #app reach the hash router (which would route to Home)
  if (e.target.closest('#skipLink')){ e.preventDefault(); const m = document.getElementById('app'); m.focus({ preventScroll: true }); m.scrollIntoView({ block: 'start' }); return; }
  const lang = e.target.closest('[data-lang]');
  if (lang){ state.lang = lang.dataset.lang; try{ localStorage.setItem('forum-lang', state.lang); }catch(err){} route(); return; }
  if (e.target.closest('.scroll-cue')){ const next = document.querySelector('.intro') || document.querySelector('.netsec'); if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (e.target.closest('#burger')){ const m = document.getElementById('menu'); const on = m.classList.toggle('show'); e.target.closest('#burger').setAttribute('aria-expanded', on); return; }
  const menuBtn = e.target.closest('.menu>li>button');
  if (menuBtn){ const li = menuBtn.parentElement; const was = li.classList.contains('open'); document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open')); if(!was) li.classList.add('open'); return; }
  if (e.target.closest('.drop a')){ document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open')); document.getElementById('menu').classList.remove('show'); }
  const day = e.target.closest('[data-day]');
  const vw = e.target.closest('[data-view]');
  if (vw){ state.view = vw.dataset.view; document.getElementById('app').innerHTML = P['program/schedule'](); initReveal(); updateGnbScrolled(); const b=document.querySelector(`[data-view="${state.view}"]`); if(b) b.focus(); return; }
  if (day){ state.day = +day.dataset.day; const d = document.getElementById('sch-d' + state.day); if (d) d.scrollIntoView({ behavior: MOTION ? 'smooth' : 'auto', block: 'start' }); return; }
  const sg = e.target.closest('[data-step-go]'); if (sg){ const g = document.getElementById('fx-' + sg.dataset.stepGo); if (g) g.scrollIntoView({ behavior: MOTION ? 'smooth' : 'auto', block: 'start' }); return; }
  const nc = e.target.closest('.net-c'); if (nc){ selectCountry(nc.dataset.c); return; }
  const pt = e.target.closest('.pt'); if (pt){ selectCountry(pt.dataset.c); return; }
  const row = e.target.closest('.data tr[data-c]'); if (row){ selectCountry(row.dataset.c); document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if (!e.target.closest('.menu')) document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pt')){ e.preventDefault(); selectCountry(e.target.dataset.c); }
  if (e.key === 'Escape') document.querySelectorAll('.menu>li').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('mouseover', e => {
  const pt = e.target.closest('.pt'); const ro = document.getElementById('readout');
  if (pt && ro) ro.innerHTML = readout(pt.dataset.c);
});
document.addEventListener('mouseout', e => {
  const pt = e.target.closest('.pt'); const ro = document.getElementById('readout');
  if (pt && ro && !(e.relatedTarget && pt.contains(e.relatedTarget))) ro.innerHTML = readout(state.country);
});
document.addEventListener('input', e => {
  if (e.target.id === 'bcount' || e.target.name === 'btype') updateFee();
});
document.addEventListener('change', e => { if (e.target.name === 'btype') updateFee(); });
function updateFee(){
  const o = document.getElementById('bfee'); if (!o) return;
  const t = document.querySelector('input[name="btype"]:checked'); const n = Math.max(0, parseInt(document.getElementById('bcount').value,10) || 0);
  o.textContent = t && t.value === 'raw' ? k('무료','Free') : won(n * BOOTH_PRICE);
}
document.addEventListener('submit', e => {
  const f = e.target.closest('form.f'); if (!f) return;
  e.preventDefault();
  const st = f.querySelector('.status');
  if (!f.checkValidity()){
    const bad = f.querySelector(':invalid');
    f.classList.add('was-validated');
    st.className = 'status err';
    // the contact form has no consent box, so it gets its own message
    st.textContent = f.dataset.form === 'contact'
      ? k('필수 항목(문의 유형, 성명, 이메일, 문의 내용)을 확인해 주세요. 이메일 형식도 함께 확인해 주세요.','Check the required fields (topic, name, email and message), including the email format.')
      : k('필수 항목을 확인해 주세요. 이메일 형식과 개인정보 동의 여부를 함께 확인해 주세요.','Check the required fields, including the email format and the consent box.');
    if (bad) bad.focus();
    return;
  }
  st.className = 'status ok';
  const msg = { exhibitor:k('전시 참가 신청서가 작성되었습니다. 사무국 검토 후 확정 통보를 드립니다. 문의: 055-602-1993','Application completed. The secretariat will confirm after review. Questions: +82 55-602-1993'),
    visitor:k('사전등록 신청이 작성되었습니다. 등록 확인 메일은 접수 시스템 오픈 후 발송됩니다.','Registration completed. A confirmation email will follow once online intake opens.'),
    contact:k('문의가 작성되었습니다. 사무국 연락처 공지 후 순차적으로 답변드립니다.','Message completed. The secretariat will reply once contact channels open.') };
  st.textContent = msg[f.dataset.form];
});

route();
</script>
